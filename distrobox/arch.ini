# See examples and usage
#   https://github.com/89luca89/distrobox/blob/main/docs/usage/distrobox-assemble.md#examples
#
# TL;DR:
# Install via e.g.
#   distrobox assemble create --file arch.ini --name arch
#   distrobox enter arch
#
# Log can be looked at via
#   docker logs -f arch
#
# Application can be exported like
#   distrobox enter arch
#   distrobox-export --bin $(which nano) --export-path $HOME/.local/bin/
[base]
pull=true
init=true

[arch]
include=base
image=archlinux:latest
hostname=arch
root=false
additional_packages="lazygit systemd"
exported_bins="/usr/bin/htop /usr/bin/git"
exported_bins_path="${HOME}/.local/bin"
